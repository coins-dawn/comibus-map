<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カードの試作：グライダーワゴン 妻沼循環</title>
<style>
  body { margin: 0; background: #f7f6f2; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #22201c; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card { width: 340px; aspect-ratio: 5 / 7; border-radius: 16px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #fff7e6, #ffe3c2); color: #4a3426; box-shadow: 0 3px 12px rgba(0, 0, 0, .18); border: 3px solid #4a3426; }
  .top { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; }
  .map { position: relative; margin: 6px 0 8px; border-radius: 10px; overflow: hidden; border: 2px solid #4a3426; background: #fffdf6; flex: 1; }
  .map svg { display: block; width: 100%; height: 100%; }
  .bgmap { opacity: .3; filter: grayscale(.5) sepia(.2); }
  .nm { font-size: 21px; font-weight: 900; line-height: 1.2; }
  .sub { font-size: 12.5px; opacity: .85; }
  .badges { display: flex; gap: 6px; margin-top: 6px; }
  .badges span { font-size: 12px; font-weight: 800; padding: 1px 9px; border-radius: 999px; border: 2px solid #4a3426; background: #fff; }
  .note { font-size: 11px; color: #6b665c; max-width: 340px; line-height: 1.5; }
  .lbl { font-size: 8.6px; font-weight: 800; fill: #4a3426; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  /* 動き（どこで飲む？ナビ と同じ考え方: 足もとを支点に） */
  .ic { transform-box: fill-box; }
  .bow  { transform-origin: 50% 100%; animation: bow 2.4s ease-in-out infinite; }
  .munch{ animation: munch .5s ease-in-out infinite alternate; }
  .glide{ animation: glide 3.2s ease-in-out infinite; }
  .rock { transform-origin: 50% 80%; animation: rock 2.2s ease-in-out infinite; }
  .wave { transform-origin: 20% 90%; animation: wave .7s ease-in-out infinite alternate; }
  .hop  { animation: hop .45s ease-in-out infinite alternate; }
  .float{ animation: float 1.6s ease-in-out infinite alternate; }
  .bob  { animation: hop .3s ease-in-out infinite alternate; }
  @keyframes bow { 0%, 25%, 100% { transform: rotate(0); } 50%, 70% { transform: rotate(-16deg); } }
  @keyframes munch { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
  @keyframes glide { 0% { transform: translate(-3px, 1px) rotate(-4deg); } 50% { transform: translate(3px, -3px) rotate(3deg); } 100% { transform: translate(-3px, 1px) rotate(-4deg); } }
  @keyframes rock { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes wave { from { transform: rotate(-10deg); } to { transform: rotate(18deg); } }
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .ic, .ic * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top"><span>熊谷市ゆうゆうバス</span><span>試作</span></div>
    <div class="map" id="map"></div>
    <div class="nm">グライダーワゴン<br>妻沼循環</div>
    <div class="sub">埼玉県熊谷市・31 のバス停をぐるっと 1 周</div>
    <div class="badges"><span>200 円</span><span>1 日 3 周</span></div>
  </div>
  <p class="note">試作（1 か所だけ）。経路: 熊谷市 GTFS（GTFSデータリポジトリ）。スポットの位置: © OpenStreetMap contributors（聖天寿司は「妻沼聖天前」バス停の位置）。背景: 地理院タイル（淡色地図）。イラストは自作。</p>
</div>
<script>
'use strict';
// ---- 自作のイラスト（64×64、足もとが下端の中央）。線はこげ茶 #4a3426、ほっぺはピンク
const INK = '#4a3426', SKIN = '#ffd9b8', CHEEK = '#ff9eb0';
const face = (cx, cy, eyes = 'smile') => {
  const e = eyes === 'closed'
    ? `<path d="M${cx - 6.5} ${cy + 1} q2 2.4 4 0"/><path d="M${cx + 2.5} ${cy + 1} q2 2.4 4 0"/>`
    : `<path d="M${cx - 6.5} ${cy + 1.6} q2 -2.6 4 0"/><path d="M${cx + 2.5} ${cy + 1.6} q2 -2.6 4 0"/>`;
  return `<circle cx="${cx - 7}" cy="${cy + 4.6}" r="2.2" fill="${CHEEK}"/><circle cx="${cx + 7}" cy="${cy + 4.6}" r="2.2" fill="${CHEEK}"/>
    <g fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round">${e}</g>`;
};
const head = (cx, cy, hair = '#3a2a20') => `<circle cx="${cx}" cy="${cy}" r="10" fill="${SKIN}" stroke="${INK}" stroke-width="2.2"/>
  <path d="M${cx - 10} ${cy - 1} Q${cx - 9.5} ${cy - 11} ${cx} ${cy - 11} Q${cx + 10} ${cy - 11} ${cx + 10} ${cy - 1.5} Q${cx + 5} ${cy - 6} ${cx} ${cy - 5.5} Q${cx - 5} ${cy - 6} ${cx - 10} ${cy - 1} Z" fill="${hair}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
const limb = (d, fill, w = 6.5) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="${w - 3.2}" stroke-linecap="round" stroke-linejoin="round"/>`;
const shoe = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="3.8" ry="2.3" fill="#e2483d" stroke="${INK}" stroke-width="1.8"/>`;

const ICONS = {
  // 妻沼聖天山: 彫刻で彩られた本殿の前で手を合わせて、おじぎする
  shoden: `<g>
    <path d="M2 56 H36" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="6" y="34" width="24" height="21" fill="#f7b733" stroke="${INK}" stroke-width="2"/>
    <g stroke="${INK}" stroke-width="1.2"><circle cx="11" cy="40" r="2.2" fill="#e2483d"/><circle cx="18" cy="39" r="2.2" fill="#7cc8f8"/><circle cx="25" cy="40" r="2.2" fill="#5fbf6f"/>
      <circle cx="14.5" cy="46" r="2.2" fill="#ff9eb0"/><circle cx="21.5" cy="46" r="2.2" fill="#e2483d"/></g>
    <rect x="14" y="49" width="8" height="6" fill="#6b4226" stroke="${INK}" stroke-width="1.6"/>
    <path d="M1 35 Q9 31 11 22 H25 Q27 31 35 35 Z" fill="#7a4a2b" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M13 22 Q18 17 23 22" fill="#f7b733" stroke="${INK}" stroke-width="1.8"/>
    <g class="ic bow">
      ${limb('M45 46 L44 56', '#5c6878')}${limb('M52 46 L53 56', '#5c6878')}${shoe(43, 57)}${shoe(54, 57)}
      <path d="M40 34 Q48.5 29 57 34 L57.5 47 Q48.5 50 39.5 47 Z" fill="#7cc8f8" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
      ${limb('M43 36 L38 40', SKIN)}${limb('M54 36 L39 40', SKIN)}
      <path d="M36 36 L40 42" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
      ${head(48.5, 21)}${face(48.5, 21, 'closed')}
    </g>
    <g fill="#ff8a00"><path d="M60 14 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4 -3 -3 -1.4 3 -1.4 z"/></g>
  </g>`,
  // 聖天寿司（いなり寿司）を両手で持ってほおばる
  sushi: `<g>
    ${limb('M27 46 L26 56', '#5c6878')}${limb('M37 46 L38 56', '#5c6878')}${shoe(25, 57)}${shoe(39, 57)}
    <path d="M21 33 Q32 28 43 33 L44 47 Q32 50.5 20 47 Z" fill="#f2a7c3" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
    <g class="ic munch">
      ${head(32, 19)}
      <circle cx="25" cy="23.6" r="2.2" fill="${CHEEK}"/><circle cx="39" cy="23.6" r="2.2" fill="${CHEEK}"/>
      <g fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"><path d="M25.5 19.6 q2 -2.6 4 0"/><path d="M34.5 19.6 q2 -2.6 4 0"/></g>
      <path d="M29 24.5 Q32 27.5 35 24.5 Z" fill="#c8323a" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="22" y="27" width="22" height="9" rx="4.5" fill="#d89548" stroke="${INK}" stroke-width="2"/>
      <path d="M25 30 H41" stroke="#f0c070" stroke-width="2" stroke-linecap="round"/>
      ${limb('M23 37 L24 32', SKIN)}${limb('M41 37 L41 32', SKIN)}
    </g>
    <g fill="#ff8a00" stroke="#ff8a00" stroke-width="1.6" stroke-linecap="round"><path d="M50 18 l3 -2"/><path d="M51 23 h3.6"/><path d="M14 18 l-3 -2"/><path d="M13 23 h-3.6"/></g>
  </g>`,
  // グライダーで空をすべる
  glider: `<g class="ic glide">
    <path d="M4 34 Q32 28 60 31 L60 33.5 Q32 31.5 4 37 Z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M10 40 Q30 34 50 38 Q52 41 48 42 L16 44 Q9 44 10 40 Z" fill="#fff" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M10 40 L4 33 L7 32 L15 39" fill="#e2483d" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M36 37 Q41 30 47 37" fill="#7cc8f8" stroke="${INK}" stroke-width="1.8"/>
    <circle cx="40" cy="30" r="7.5" fill="${SKIN}" stroke="${INK}" stroke-width="2"/>
    <path d="M32.6 28.5 Q33 22 40 22 Q47 22 47.4 28.5 Z" fill="#e2483d" stroke="${INK}" stroke-width="1.8"/>
    <rect x="35.4" y="26.4" width="9.2" height="3.6" rx="1.8" fill="#bfe6ff" stroke="${INK}" stroke-width="1.5"/>
    <circle cx="35" cy="33" r="1.7" fill="${CHEEK}"/><circle cx="45" cy="33" r="1.7" fill="${CHEEK}"/>
    <path d="M38 33 q2 1.8 4 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
    <g stroke="#7cc8f8" stroke-width="2" stroke-linecap="round"><path d="M56 42 h6"/><path d="M53 47 h8"/><path d="M58 37 h4"/></g>
  </g>`,
  // 赤岩渡船（利根川の渡し）: 小舟でさおをさす
  ferry: `<g>
    <g class="ic rock">
      ${limb('M30 41 L29 48', '#5c6878')}${limb('M36 41 L37 48', '#5c6878')}
      <path d="M24 29 Q33 25 42 29 L43 42 Q33 45 23 42 Z" fill="#5fbf6f" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M52 8 L38 56" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>
      ${limb('M27 32 L45 24', SKIN)}${limb('M39 33 L47 31', SKIN)}
      ${head(33, 17)}${face(33, 17)}
      <path d="M21 12 Q33 3 45 12 Q33 9 21 12 Z" fill="#f2d16b" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M8 46 H58 Q55 56 46 56 H19 Q11 56 8 46 Z" fill="#c98b4f" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M12 50 H54" stroke="#e7b27c" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M2 59 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#7cc8f8" stroke-width="2.4" stroke-linecap="round"/>
  </g>`,
  // 荻野吟子記念館（日本で最初の女性の医師）: はかま姿で聴診器、手をふる
  ginko: `<g>
    <path d="M22 34 Q32 29 42 34 L45 56 H19 Z" fill="#9b6bb5" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M23 33 Q32 29 41 33 L41.5 41 Q32 43 22.5 41 Z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M27 33 Q27 44 32 44 Q37 44 37 33" fill="none" stroke="#5c6878" stroke-width="1.8"/>
    <circle cx="32" cy="45" r="2.3" fill="#c9d3dc" stroke="${INK}" stroke-width="1.5"/>
    ${limb('M24 36 L19 44', '#fff')}
    <g class="ic wave">${limb('M40 36 L48 26', '#fff')}<circle cx="49" cy="24.5" r="2.6" fill="${SKIN}" stroke="${INK}" stroke-width="1.6"/></g>
    ${head(32, 20)}
    <circle cx="32" cy="7.5" r="5" fill="#3a2a20" stroke="${INK}" stroke-width="2"/>
    ${face(32, 20)}
    <path d="M30 26 q2 1.8 4 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
    <g stroke="#ff8a00" stroke-width="1.8" stroke-linecap="round"><path d="M54 20 l3 -2"/><path d="M55 25 h3.4"/></g>
  </g>`,
  // 道の駅めぬま: 野菜のかごを持って、はねる
  michi: `<g class="ic hop">
    ${limb('M27 46 L25 55', '#5c6878')}${limb('M37 46 L39 55', '#5c6878')}${shoe(24, 56)}${shoe(40, 56)}
    <path d="M21 33 Q32 28 43 33 L44 47 Q32 50.5 20 47 Z" fill="#f7b733" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
    ${head(32, 19, '#6b4226')}${face(32, 19)}
    <path d="M29 25 q3 3 6 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M44 30 l3 -8 M47 30 l5 -7 M49 31 l7 -4" stroke="#5fbf6f" stroke-width="3" stroke-linecap="round"/>
    <path d="M51 30 l-2 9" stroke="#ff8a00" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="34" r="3.6" fill="#e2483d" stroke="${INK}" stroke-width="1.6"/>
    <path d="M40 34 H58 L55 45 H43 Z" fill="#d89548" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M42 38 H56 M43 41.5 H55" stroke="#f0c070" stroke-width="1.4"/>
    ${limb('M40 37 L44 37', SKIN)}${limb('M24 36 L19 42', SKIN)}
  </g>`,
  // バス（ワゴン）。前が右
  bus: `<g class="ic bob">
    <path d="M6 14 Q6 6 14 6 H44 Q54 6 57 15 L58 24 Q58 28 54 28 H10 Q6 28 6 24 Z" fill="#fff" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M6 19 H58" stroke="#e2483d" stroke-width="3"/>
    <rect x="11" y="9" width="9" height="7" rx="1.5" fill="#bfe6ff" stroke="${INK}" stroke-width="1.6"/>
    <rect x="23" y="9" width="9" height="7" rx="1.5" fill="#bfe6ff" stroke="${INK}" stroke-width="1.6"/>
    <path d="M36 9 H46 Q51 9 53 16 H36 Z" fill="#bfe6ff" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
    <g fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"><path d="M41.5 13.2 q1.5 -2 3 0"/><path d="M47 13.2 q1.5 -2 3 0"/></g>
    <circle cx="40.5" cy="15" r="1.4" fill="${CHEEK}"/><circle cx="52" cy="15" r="1.4" fill="${CHEEK}"/>
    <circle cx="17" cy="28" r="4.6" fill="#5c6878" stroke="${INK}" stroke-width="2"/><circle cx="47" cy="28" r="4.6" fill="#5c6878" stroke="${INK}" stroke-width="2"/>
  </g>`,
};

// ---- スポット（緯度・経度は OSM とバス停の位置）。dx, dy は重ならないように絵をずらす量（px）
const SPOTS = [
  { k: 'shoden', name: '妻沼聖天山', lat: 36.22819, lon: 139.37467, dx: -26, dy: -10 },
  { k: 'sushi',  name: '聖天寿司',   lat: 36.22807, lon: 139.37756, dx: 26, dy: -18 },
  { k: 'michi',  name: '道の駅めぬま', lat: 36.21481, lon: 139.36874, dx: -6, dy: 22 },
  { k: 'glider', name: '妻沼滑空場',  lat: 36.2111, lon: 139.4200, dx: -8, dy: -40 },
  { k: 'ferry',  name: '赤岩渡船', lat: 36.20495, lon: 139.42922, dx: 14, dy: -28 },
  { k: 'ginko',  name: '荻野吟子記念館', lat: 36.19885, lon: 139.43315, dx: -16, dy: 40 },
];

const TILE = 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png';
const merc = (lat, lon) => { const r = lat * Math.PI / 180; return [(lon + 180) / 360, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2]; };

async function main() {
  const F = await fetch('data/f/kumagayacity__yuuyuubus.json').then((r) => r.json());
  const R = F.routes.indexOf('グライダーワゴン　妻沼循環');
  const lines = F.shape.filter((l) => l[0] === R).map((l) => l[1]);
  const trip = F.trips.find((t) => t[0] === R);
  const stops = [...new Set(trip[3])].map((i) => F.stops[i]);
  const W = 312, H = 300;
  const pts = lines.flat().concat(SPOTS.map((s) => [s.lat, s.lon])).map((p) => merc(p[0], p[1]));
  const x0 = Math.min(...pts.map((p) => p[0])), x1 = Math.max(...pts.map((p) => p[0]));
  const y0 = Math.min(...pts.map((p) => p[1])), y1 = Math.max(...pts.map((p) => p[1]));
  const pad = 44, s = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0));
  const wx = (x0 + x1) / 2 - W / 2 / s, wy = (y0 + y1) / 2 - H / 2 / s;
  const P = (lat, lon) => { const m = merc(lat, lon); return [(m[0] - wx) * s, (m[1] - wy) * s]; };
  const z = Math.max(5, Math.min(16, Math.round(Math.log2(s * 2 / 256)))), n = 2 ** z, ts = s / n;
  let tiles = '';
  for (let tx = Math.floor(wx * n); tx <= Math.floor((wx + W / s) * n); tx++)
    for (let ty = Math.floor(wy * n); ty <= Math.floor((wy + H / s) * n); ty++)
      tiles += `<image href="${TILE.replace('{z}', z).replace('{x}', tx).replace('{y}', ty)}" x="${(tx / n - wx) * s}" y="${(ty / n - wy) * s}" width="${ts + .5}" height="${ts + .5}"/>`;
  const d = lines.map((l) => l.map((p, i) => { const [x, y] = P(p[0], p[1]); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join('')).join('');
  const stopDots = stops.map((st) => { const [x, y] = P(st[1], st[2]); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="#fff" stroke="${INK}" stroke-width="1.3"/>`; }).join('');
  const SZ = 46;
  const spots = SPOTS.map((sp) => {
    const [x, y] = P(sp.lat, sp.lon), ix = x + sp.dx, iy = y + sp.dy;
    return `<g><path d="M${x} ${y} L${ix} ${iy}" stroke="${INK}" stroke-width="1.3" stroke-dasharray="2 2"/>
      <circle cx="${x}" cy="${y}" r="3.2" fill="#ff8a00" stroke="${INK}" stroke-width="1.4"/>
      <svg x="${ix - SZ / 2}" y="${iy - SZ * 0.82}" width="${SZ}" height="${SZ}" viewBox="0 0 64 64" overflow="visible">${ICONS[sp.k]}</svg>
      <text class="lbl" x="${ix}" y="${iy + SZ * 0.26}" text-anchor="middle">${sp.name}</text></g>`;
  }).join('');
  // バスは経路の上を 1 周する（16 秒）。経路の線に沿って毎フレーム動かす
  const busD = lines[0].map((p, i) => { const [x, y] = P(p[0], p[1]); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join('');
  const bus = `<path id="bus-path" d="${busD}" fill="none" stroke="none"/>
    <g id="bus"><svg x="-15" y="-24" width="30" height="30" viewBox="0 0 64 64" overflow="visible"><g id="bus-flip">${ICONS.bus}</g></svg></g>`;
  document.getElementById('map').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
    <g class="bgmap">${tiles}</g>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#e2483d" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${stopDots}${spots}${bus}</svg>`;
  const path = document.getElementById('bus-path'), g = document.getElementById('bus'), flip = document.getElementById('bus-flip');
  const L = path.getTotalLength(), T = 16000;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = (now) => {
    const t = still ? 0.1 : (now % T) / T;
    const p = path.getPointAtLength(t * L), q = path.getPointAtLength(Math.min(L, t * L + 2));
    g.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    // 左へ進むときは左右を反転して、前を進む向きに向ける
    flip.setAttribute('transform', q.x < p.x - 0.05 ? 'translate(64 0) scale(-1 1)' : '');
    if (!still) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
main();
</script>
</body>
</html>
