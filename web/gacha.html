<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コミバスガチャ</title>
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>
<main>
  <section id="v-top" class="view">
    <h1 class="logo"><span>コミバス</span>ガチャ</h1>
    <div class="mode" role="tablist"><button data-yen="100">100円ガチャ</button><button data-yen="500">500円ガチャ</button></div>
    <p class="lead" id="lead"></p>
    <div class="machine-box" id="machine-box">
      <div id="machine"></div>
      <div class="drop" id="drop"></div>
      <div class="flash" id="flash"></div>
    </div>
    <button id="pull" class="pull">ガチャを引く</button>
    <p class="count" id="count"></p>
  </section>

  <section id="v-result" class="view" hidden>
    <h2 class="res-title" id="res-title">当たったカード</h2>
    <p class="total" id="total"></p>
    <div class="row" id="row"></div>
    <div class="dots" id="dots"></div>
    <p class="hint" id="hint">左右にスワイプして 3 枚を見られます。タップすると大きく見られます</p>
    <button id="again" class="pull">もう 1 回まわす</button>
    <button id="back" class="linkbtn">100円 / 500円をえらびなおす</button>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-in" id="modal-in"></div>
</div>

<footer>
  <p>経路・バス停・運賃: <a href="https://gtfs-data.jp/">GTFSデータリポジトリ</a>に登録された各自治体の GTFS-JP を加工（事業者ごとのライセンスはカードを開くと表示）。
    スポット: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>（ODbL）。背景地図: <a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>（淡色地図）。イラストは自作。
    時刻や運賃は変わることがあります。乗る前に各自治体の案内を確かめてください。</p>
</footer>
<script src="icons.js?v=46"></script>
<script src="card.js?v=46"></script>
<script src="spotart.js?v=46"></script>
<script src="app.js?v=46"></script>
</body>
</html>
